<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国お出かけ天気予報</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      margin-top: 0;
      color: #333;
      text-align: center;
    }
    select {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      border-radius: 10px;
      border: 1px solid #ddd;
      margin-bottom: 20px;
      outline: none;
      background: #fff;
    }
    .main-status {
      text-align: center;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
    }
    .temp {
      font-size: 3.2em;
      font-weight: bold;
      color: #007bff;
      margin: 5px 0;
    }
    .weather-desc {
      font-size: 1.3em;
      font-weight: bold;
      color: #444;
    }
    .advice-box {
      background: #f8f9fa;
      border-left: 4px solid #007bff;
      padding: 12px;
      border-radius: 6px;
      margin: 15px 0;
      text-align: left;
    }
    .advice-title {
      font-weight: bold;
      font-size: 0.9em;
      color: #007bff;
      margin-bottom: 5px;
    }
    .advice-item {
      font-size: 0.95em;
      color: #333;
      margin: 4px 0;
    }
    .weekly-title {
      font-size: 0.9em;
      font-weight: bold;
      color: #666;
      margin-top: 15px;
      margin-bottom: 8px;
    }
    .weekly-list {
      display: flex;
      justify-content: space-between;
      gap: 5px;
    }
    .weekly-day {
      background: #fff;
      border: 1px solid #eee;
      padding: 8px 2px;
      border-radius: 8px;
      flex: 1;
      text-align: center;
      font-size: 0.72em;
    }
    .weekly-day .date { color: #888; }
    .weekly-day .w-temp { font-weight: bold; margin-top: 4px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>全国お出かけ天気予報</h2>
    
    <select id="citySelect" onchange="getWeather()">
      <optgroup label="北海道・東北">
        <option value="43.0642,141.3469">北海道 (札幌)</option>
        <option value="41.7687,140.7288">北海道 (函館)</option>
        <option value="40.8244,140.7400">青森県 (青森)</option>
        <option value="39.7036,141.1527">岩手県 (盛岡)</option>
        <option value="38.2688,140.8721">宮城県 (仙台)</option>
        <option value="39.7186,140.1024">秋田県 (秋田)</option>
        <option value="38.2404,140.3633">山形県 (山形)</option>
        <option value="37.7608,140.4748">福島県 (福島)</option>
      </optgroup>
      <optgroup label="関東">
        <option value="36.3418,140.4468">茨城県 (水戸)</option>
        <option value="36.5657,139.8836">栃木県 (宇都宮)</option>
        <option value="36.3911,139.0608">群馬県 (前橋)</option>
        <option value="35.8574,139.6489">埼玉県 (さいたま)</option>
        <option value="35.6074,140.1065">千葉県 (千葉)</option>
        <option value="35.6895,139.6917" selected>東京都 (東京)</option>
        <option value="35.4478,139.6425">神奈川県 (横浜)</option>
      </optgroup>
      <optgroup label="中部・北陸">
        <option value="37.9022,139.0236">新潟県 (新潟)</option>
        <option value="36.6953,137.2113">富山県 (富山)</option>
        <option value="36.5944,136.6256">石川県 (金沢)</option>
        <option value="36.0652,136.2216">福井県 (福井)</option>
        <option value="35.6642,138.5684">山梨県 (甲府)</option>
        <option value="36.6513,138.1810">長野県 (長野)</option>
        <option value="35.3912,136.7223">岐阜県 (岐阜)</option>
        <option value="34.9769,138.3831">静岡県 (静岡)</option>
        <option value="35.1815,136.9064">愛知県 (名古屋)</option>
      </optgroup>
      <optgroup label="近畿">
        <option value="34.7303,136.5086">三重県 (津)</option>
        <option value="35.0045,135.8686">滋賀県 (大津)</option>
        <option value="35.0211,135.7556">京都府 (京都)</option>
        <option value="34.6937,135.5023">大阪府 (大阪)</option>
        <option value="34.6913,135.1830">兵庫県 (神戸)</option>
        <option value="34.6853,135.8328">奈良県 (奈良)</option>
        <option value="34.2260,135.1675">和歌山県 (和歌山)</option>
      </optgroup>
      <optgroup label="中国・四国">
        <option value="35.5039,134.2383">鳥取県 (鳥取)</option>
        <option value="35.4723,133.0505">島根県 (松江)</option>
        <option value="34.6618,133.9344">岡山県 (岡山)</option>
        <option value="34.3963,132.4594">広島県 (広島)</option>
        <option value="34.1859,131.4714">山口県 (山口)</option>
        <option value="34.0657,134.5593">徳島県 (徳島)</option>
        <option value="34.3402,134.0434">香川県 (高松)</option>
        <option value="33.8416,132.7657">愛媛県 (松山)</option>
        <option value="33.5597,133.5311">高知県 (高知)</option>
      </optgroup>
      <optgroup label="九州・沖縄">
        <option value="33.5904,130.4017">福岡県 (福岡)</option>
        <option value="33.2494,130.2988">佐賀県 (佐賀)</option>
        <option value="32.7448,129.8737">長崎県 (長崎)</option>
        <option value="32.7898,130.7417">熊本県 (熊本)</option>
        <option value="33.2382,131.6126">大分県 (大分)</option>
        <option value="31.9111,131.4239">宮崎県 (宮崎)</option>
        <option value="31.5602,130.5580">鹿児島県 (鹿児島)</option>
        <option value="26.2124,127.6809">沖縄県 (那覇)</option>
        <option value="24.3448,124.1572">沖縄県 (石垣島)</option>
      </optgroup>
    </select>

    <div id="result">
      <p style="text-align:center;">読み込み中...</p>
    </div>
  </div>

  <script>
    const weatherCodes = {
      0: "晴れ", 1: "ほぼ晴れ", 2: "時々曇り", 3: "曇り",
      45: "霧", 48: "霧氷",
      51: "小雨", 53: "雨", 55: "強い雨",
      61: "弱めの雨", 63: "雨", 65: "激しい雨",
      71: "弱い雪", 73: "雪", 75: "激しい雪",
      80: "にわか雨", 81: "強いにわか雨", 82: "激しいにわか雨",
      95: "雷雨"
    };

    function getAdvice(code, temp, maxTemp) {
      let items = [];
      let clothes = "";

      if ([51, 53, 55, 61, 63, 65, 80, 81, 82, 95].includes(code)) {
        items.push("☔ 大きい傘（雨です）");
      } else if ([1, 2, 3].includes(code)) {
        items.push("☂️ 折りたたみ傘（念のため）");
      } else {
        items.push("☀️ 傘は不要です");
      }

      if (temp < 10) {
        clothes = "🧥 厚手のコート・ダウン・マフラー";
      } else if (temp < 15) {
        clothes = "🧥 ジャケットや秋・春物コート";
      } else if (temp < 20) {
        clothes = "👔 カーディガンや長袖シャツ";
      } else if (temp < 25) {
        clothes = "👕 半袖＋羽織るもの";
      } else {
        clothes = "👕 半袖（熱中症に注意）";
      }

      if (code === 0 && temp >= 20) {
        items.push("🕶️ 日傘・帽子・日焼け止め");
      }
      if (maxTemp - temp > 8) {
        items.push("🧣 朝晩の寒暖差対策の羽織りもの");
      }

      return { items, clothes };
    }

    async function getWeather() {
      const select = document.getElementById('citySelect');
      const [lat, lon] = select.value.split(',');
      const resultDiv = document.getElementById('result');

      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        const current = data.current_weather;
        const temp = Math.round(current.temperature);
        const maxTemp = Math.round(data.daily.temperature_2m_max[0]);
        const minTemp = Math.round(data.daily.temperature_2m_min[0]);
        const weatherText = weatherCodes[current.weathercode] || "不明";

        const advice = getAdvice(current.weathercode, temp, maxTemp);

        let weeklyHtml = "";
        for (let i = 0; i < 5; i++) {
          const dateStr = data.daily.time[i].slice(5).replace('-', '/');
          const wCode = data.daily.weathercode[i];
          const wMax = Math.round(data.daily.temperature_2m_max[i]);
          weeklyHtml += `
            <div class="weekly-day">
              <div class="date">${dateStr}</div>
              <div>${weatherCodes[wCode] || '不明'}</div>
              <div class="w-temp">${wMax}℃</div>
            </div>
          `;
        }

        resultDiv.innerHTML = `
          <div class="main-status">
            <div class="weather-desc">${weatherText}</div>
            <div class="temp">${temp}℃</div>
            <div style="color: #666; font-size: 0.85em;">最高: ${maxTemp}℃ / 最低: ${minTemp}℃</div>
          </div>

          <div class="advice-box">
            <div class="advice-title">🎒 今日のおすすめ持ち物</div>
            ${advice.items.map(item => `<div class="advice-item">• ${item}</div>`).join('')}
            <div class="advice-title" style="margin-top: 10px;">👔 おすすめの服装</div>
            <div class="advice-item">• ${advice.clothes}</div>
          </div>

          <div class="weekly-title">📅 5日間の予報</div>
          <div class="weekly-list">
            ${weeklyHtml}
          </div>
        `;

      } catch (error) {
        resultDiv.innerHTML = '<p style="color:red; text-align:center;">データの取得に失敗しました</p>';
      }
    }

    getWeather();
  </script>

</body>
</html>
